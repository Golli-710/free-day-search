name: Weekly area SNS images
on:
  schedule:
    # Sunday 08:35 JST. Prepare next Monday's two-week kit; never publish automatically.
    - cron: '35 23 * * 6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: social-kit
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline image tools
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Check selection and tracking
        run: npm run test:social
      - name: Prepare next two weeks
        run: |
          START=$(node -e "const d=new Date();const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);const n=new Date(p+'T12:00:00Z');n.setUTCDate(n.getUTCDate()+((8-n.getUTCDay())%7||7));console.log(n.toISOString().slice(0,10))")
          npm run social:pack -- --start "$START" --weeks 2 --roundup
          npm run social:images
      - uses: actions/upload-artifact@v4
        with:
          name: area-sns-kit-${{ github.run_id }}
          path: social/outbox/trial/
          retention-days: 21

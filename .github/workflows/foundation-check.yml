name: Verify revenue foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify analytics consent and data minimization
        run: node --test scripts/analytics.test.mjs
      - name: Verify generated metadata and Cloudflare isolation
        run: |
          python3 -m unittest discover -s scripts -p test_site_metadata.py
          python3 -m unittest discover -s scripts -p test_cloudflare.py
